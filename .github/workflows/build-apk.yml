name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repo is an overlay: generate the standard Flutter shell, then copy our files over it.
      - name: Generate Flutter shell and apply overlay
        run: |
          flutter create --org com.agrisense --project-name agrisense_widget --platforms android "$RUNNER_TEMP/app"
          rsync -a --exclude '.git' --exclude '.github' --exclude 'README.md' ./ "$RUNNER_TEMP/app/"

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/app
        run: flutter pub get

      - name: Analyze (informational)
        working-directory: ${{ runner.temp }}/app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ${{ runner.temp }}/app
        run: flutter build apk --release

      - name: Name the APK
        run: cp "$RUNNER_TEMP/app/build/app/outputs/flutter-apk/app-release.apk" "$RUNNER_TEMP/AgriSense-Widget.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AgriSense-Widget-apk
          path: ${{ runner.temp }}/AgriSense-Widget.apk
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/AgriSense-Widget.apk
