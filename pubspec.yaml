name: agrisense_widget
description: AgriSense live readings and a resizable home / lock screen widget.
publish_to: 'none'
version: 1.0.3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_svg: ^2.0.10+1
  url_launcher: ^6.3.0
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito_800ExtraBold.ttf
          weight: 800
